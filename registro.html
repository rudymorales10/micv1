<html>
<head>
  <h1>Registro de contacto</h1>
<link rel="stylesheet" href="estilos.css">
<style>
body
{

}
form {
  margin: 0 auto;
  width: 400px;
  padding: 1em;
  border: 1px solid #ccc;
  border-radius: 1em;
}

ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

form li + li {
  margin-top: 1em;
}

label {
  display: inline-block;
  width: 90px;
  text-align: right;
}

input,
textarea {
  font: 1em sans-serif;
  width: 300px;
  box-sizing: border-box;
  border: 1px solid #999;
}

input:focus,
textarea:focus {
  border-color: #000;
}

textarea {
  vertical-align: top;
  height: 5em;
}

.button {
  padding-left: 90px;
}

button {
  margin-left: 0.5em;
}
</style>

<title>Mi primer formulario-para e-mail</title>
</head>
<body>
  <form action="https://formspree.io/f/xpqkoogr" method="POST">
    <ul>
      <li>
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="user_name" />
      </li>
      <li>
        <label for="mail">Correo electrónico:</label>
        <input type="email" id="mail" name="email" />
      </li>
      <li>
        <label for="msg">Mensaje:</label>
        <textarea id="msg" name="message"></textarea>
      </li>
      <li class="button">
        <button type="submit">Enviar</button>
      </li>
    </ul>
  </form>
</body>
</html>
